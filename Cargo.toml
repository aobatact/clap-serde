[package]
name = "clap-serde"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Provides wrappers to deserialize and serialize clap Command using serde."
repository = "https://github.com/aobatact/clap-serde"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.docs.rs]
features = ["docsrs"]

[features]
default = ["snake-case-key", "allow-deprecated", "help"]
env = ["clap/env"]
help = ["clap/help"]
pascal-case-key = ["convert_case"]
kebab-case-key = ["convert_case"]
snake-case-key = []
yaml = ["yaml-rust"]
color = ["clap/color"]
docsrs = ["snake-case-key", "yaml", "env", "color", "help", "schema"]
allow-deprecated = []
override-arg = []
schema = ["dep:serde_json"]

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "string"]}
serde = { version = "1", features = ["derive"]}
yaml-rust = { version = "0.4.5", default-features = false, optional = true }
convert_case = { version = "0.12", optional = true }
serde_json = { version = "1.0.75", optional = true }

[dev-dependencies]
serde_json = { version = "1.0.75" }
toml = { version = "1.2" }
serde_yaml = { version = "0.9.2" }
jsonschema = { version = "0.63.1", default-features = false }
